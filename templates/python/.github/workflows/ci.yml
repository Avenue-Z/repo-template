name: ci

on:
  pull_request:
  # `main` ONLY, deliberately. A change walks feat -> dev -> staging -> main, so branches
  # [dev, staging, main] build it SIX times per change: three PR runs, plus three push runs that
  # re-build merge commits whose content was just built as the PR head. GitHub bills every job
  # rounded up to a whole minute, and Avenue-Z ran out of Actions minutes org-wide.
  #
  # checks.yml already made this exact trade, and its comment records the same reasoning: it
  # dropped push for a cron rather than "re-scan commits that had just been scanned as PR heads".
  #
  # main survives because a promotion merge that resolves a CONFLICT produces content no PR run
  # ever saw. That is one job covering the one case, instead of three covering none.
  #
  # CHANGING THIS LATER COSTS A PR PER REPO. `workflow_call` propagates jobs and steps; it cannot
  # propagate `on:`, because a called workflow does not define triggers for its consumers. What
  # init-repo.sh copies in here is what that repo lives with until someone edits it by hand.
  push:
    branches: [main]

permissions:
  contents: read

# A CALLER, NOT A COPY. The build, the tests and Bandit live in repo-template's python-ci.yml,
# reached at the moving tag python-ci-v1, so a fix there reaches this repo with no PR here —
# including the pinned action SHAs, which Dependabot bumps once, in repo-template.
jobs:
  python-ci:
    # A job-level block REPLACES the workflow-level one, so contents: read is restated. id-token:
    # write is what lets python-ci.yml find out which ref of the template it was called at (an OIDC
    # claim; see checks.yml). DROPPING IT DOES NOT PRODUCE A RED CHECK: the run is a startup_failure
    # with ZERO jobs, `ci` never reports, and where it is required the PR hangs PENDING FOREVER.
    # scripts/apply-rulesets.sh refuses to require `ci` from a caller missing it.
    permissions:
      contents: read
      id-token: write
    uses: Avenue-Z/repo-template/.github/workflows/python-ci.yml@python-ci-v1
    with:
      # THE VERSION THIS REPO DEPLOYS ON — the one in its Dockerfile's FROM line, as a quoted string.
      # Bump both together. A library installed by other repos lists every version it supports.
      python-versions: '["3.11"]'
      # The rest of python-ci.yml's inputs, spelled out because a caller that passes none of them
      # leaves no trace that they exist. Defaults shown; uncomment to change.
      #
      # check-command: make check   # the correctness gate
      # run-bandit: true            # Bandit SAST. It scans `src` and nothing else, and REFUSES, not
      #                             # passes, a scan that finds nothing: "scan target(s) not found:
      #                             # ./src" with no src/, "bandit scanned 0 lines of code" with an
      #                             # empty one. Set false if this repo's Python does not live in src/.

  # WHY THIS JOB EXISTS. The required context is literally `ci` (scripts/apply-rulesets.sh). A called
  # job reports as `python-ci / test (3.11)` — the version is IN the name, so requiring it would break
  # on every Python bump. This job owns the stable name and does nothing else.
  #
  # `if: always()` is load-bearing: without it this job is SKIPPED when python-ci fails, and a skipped
  # required check PASSES. The PR is mergeable with failing tests (measured: Avenue-Z/repo-template
  # docs/notes/2026-09-23-phase-g-lab-proof-2.md). With it, the verdict below runs and goes red. Never
  # give this job any other `if:`: a skip by any route is a pass. scripts/apply-rulesets.sh refuses a
  # `ci` job that can be skipped. Add any per-repo job (e.g. dbt-parse) to `needs:` and it is gated
  # automatically: the verdict requires EVERY needed job to be exactly `success`.
  ci:
    needs: [python-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if jq -e 'length > 0 and all(.[]; .result == "success")' <<<"${NEEDS}" >/dev/null; then
            echo "every needed job succeeded"
          else
            echo "::error::a job this aggregate needs did not succeed:"
            jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"${NEEDS}"
            exit 1
          fi
