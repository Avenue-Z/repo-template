name: ci

on:
  pull_request:
  push:
    branches: [dev, staging, main]

# This job builds and tests; it never writes to the repo. Without this block it inherits
# whatever the repo/org default GITHUB_TOKEN scope happens to be, which is often read-write.
permissions:
  contents: read

# WHY TWO JOBS: GitHub names a matrix job's check contexts after its legs —
# "test (3.11)", "test (3.12)", "test (3.13)". A context named plainly "test"
# NEVER EXISTS. scripts/apply-rulesets.sh requires the single context "ci", and a
# required check that never reports does not fail a PR — it hangs PENDING FOREVER
# and nothing can be merged. So the matrix lives in `test`, and `ci` is a
# non-matrix aggregate whose name is the stable context rulesets can require.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The correctness gate lives in the Makefile so this command and the local one can never
      # drift — `make check` runs ruff + mypy + pytest. Security scans (bandit below, plus
      # secret-scan/sca) stay separate jobs.
      - run: make check

  ci:
    # `if: always()` is load-bearing. Without it this job is SKIPPED when the matrix
    # fails, and a skipped required check never reports either — it blocks the merge
    # just as silently as a missing one. Always run; fail loudly on a bad matrix.
    #
    # `needs` alone does NOT gate under `if: always()` — the verdict is hand-rolled in
    # scripts/ci-aggregate-gate.sh, which MUST name every job (and now every gate STEP)
    # whose failure should block.
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Item 4 Part A — first-party SAST. Bandit walks the Python AST for vulnerability shapes
      # (shell=True, yaml.load, pickle, weak crypto, ...). Bandit is offline (no token/registry).
      #
      # WHY THIS IS A STEP AND NOT A SIBLING JOB. It used to be its own job, and it took ~8
      # seconds. GitHub bills every job rounded UP to a full minute, so that job cost a whole
      # billed minute on every run — ~54 a month in the busiest repo — to do eight seconds of
      # work. Running it inside the aggregate job, which has to exist anyway to own the stable
      # `ci` context, makes that minute do real work instead of just carrying a name.
      #
      # The COST is honest and worth stating: the aggregate `needs: [test]`, so bandit no longer
      # runs in parallel with the matrix. A SAST finding now surfaces after the tests finish
      # rather than alongside them. That is slower feedback, not weaker gating.
      #
      # Version-pinned, manual-bump: an ad-hoc `pip install` is not in a manifest, so Dependabot
      # cannot bump it — the same tradeoff checks.yml makes for the osv-scanner binary. Resolve the
      # current release with `pip index versions bandit` and pin it here.
      - run: pip install "bandit==1.9.4"

      # continue-on-error is what keeps this a GATE rather than an abort. Without it a Bandit
      # finding ends the job here and the matrix verdict below never runs — the check would still
      # be red, but for a reason the log does not spell out. The verdict step is the single place
      # that decides, and it must see every gate's outcome to do that.
      - name: run Bandit and apply the policy
        id: bandit
        continue-on-error: true
        run: |
          set -euo pipefail
          # Bandit exits 1 when it finds ANY issue and 0 when clean; neither is this gate's verdict
          # (the tier + high/high threshold is applied by bandit-gate.sh), so allow both. Any OTHER
          # exit is a real Bandit error — refuse to report a clean check on a failed scan (fail-safe,
          # the same posture as the SCA gate in checks.yml).
          rc=0
          bandit -c pyproject.toml -r src -f json -o bandit.json || rc=$?
          case "${rc}" in
            0|1) ;;
            *) echo "::error::bandit exited ${rc} (not a clean/found-issues code) — failed scan, refusing to report a clean check"; exit "${rc}" ;;
          esac
          scripts/bandit-gate.sh bandit.json .github/sca-policy.json

      # The gate script is UNCHANGED — it still fails on anything that is not exactly "success".
      # Only where bandit's verdict comes from moved: `steps.bandit.outcome` instead of
      # `needs.bandit.result`. Both vocabularies are the same (success/failure/cancelled/skipped),
      # so `skipped` still means "this gate did not run", which still blocks.
      - name: Gate on the matrix and SAST results
        if: always()
        run: |
          set -euo pipefail
          scripts/ci-aggregate-gate.sh \
            "test:${{ needs.test.result }}" \
            "bandit:${{ steps.bandit.outcome }}"
